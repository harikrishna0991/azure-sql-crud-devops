name: Azure CRUD CI-CD

on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  RESOURCE_GROUP: rg-azure-crud-dev
  APP_NAME: azurecrud-dev-app
  SQL_SERVER_NAME: azurecrud-dev-sql-2026
  SQL_DATABASE_NAME: TodoDb
  KEY_VAULT_NAME: azurecrud-dev-kv-2026

  DOTNET_PROJECT: samples/features/json/todo-app/dotnet-rest-api/dotnet-rest-api.csproj

jobs:

  build:
    name: Stage 1 - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "$DOTNET_PROJECT"

      - name: Show .NET SDK
        run: |
          dotnet --version
          dotnet --info

      - name: Inspect evaluated target frameworks
        run: |
          dotnet msbuild "$DOTNET_PROJECT" -getProperty:TargetFramework -getProperty:TargetFrameworks

      - name: Build
        run: dotnet build "$DOTNET_PROJECT" --configuration Release --framework net8.0 --no-restore

      - name: Test
        run: dotnet test "$DOTNET_PROJECT" --configuration Release --framework net8.0 --no-build --verbosity normal

      - name: Publish
        run: dotnet publish "$DOTNET_PROJECT" --configuration Release --framework net8.0 --no-build --output ./publish

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-api
          path: publish/


  infrastructure:
    name: Stage 2 - Terraform and Data Initialization
    runs-on: ubuntu-latest
    needs: build

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_STORAGE_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read Terraform outputs
        id: tfout
        working-directory: terraform
        shell: bash
        run: |
          echo "app_name=$(terraform output -raw app_service_name)" >> "$GITHUB_OUTPUT"
          echo "app_principal_id=$(terraform output -raw app_service_managed_identity_principal_id)" >> "$GITHUB_OUTPUT"
          echo "sql_fqdn=$(terraform output -raw sql_fully_qualified_domain_name)" >> "$GITHUB_OUTPUT"
          echo "sql_database=$(terraform output -raw sql_database_name)" >> "$GITHUB_OUTPUT"
          echo "key_vault_name=$(terraform output -raw key_vault_name)" >> "$GITHUB_OUTPUT"

      - name: Install sqlcmd
        shell: bash
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          sqlcmd -?

      - name: Create temporary SQL firewall rule
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -fsS https://api.ipify.org)

          echo "Runner public IP: $RUNNER_IP"

          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name github-actions-temp \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Get Azure SQL access token
        shell: bash
        run: |
          set -euo pipefail

          az account get-access-token \
            --resource https://database.windows.net \
            --query accessToken \
            -o tsv > "$RUNNER_TEMP/sql-token"

          iconv -f UTF-8 -t UTF-16LE \
            "$RUNNER_TEMP/sql-token" \
            > "$RUNNER_TEMP/sql-token-utf16"

          rm -f "$RUNNER_TEMP/sql-token"

      - name: Initialize Azure SQL database
        shell: bash
        run: |
          set -euo pipefail

          sqlcmd \
            -S "${{ steps.tfout.outputs.sql_fqdn }}" \
            -d "$SQL_DATABASE_NAME" \
            -G \
            -P "$RUNNER_TEMP/sql-token-utf16" \
            -b \
            -l 60 \
            -i "scripts/sql/init.sql"

      - name: Verify SQL database objects
        shell: bash
        run: |
          set -euo pipefail

          sqlcmd \
            -S "${{ steps.tfout.outputs.sql_fqdn }}" \
            -d "$SQL_DATABASE_NAME" \
            -G \
            -P "$RUNNER_TEMP/sql-token-utf16" \
            -b \
            -l 60 \
            -Q "SELECT DB_NAME() AS DatabaseName; SELECT name FROM sys.tables WHERE name = 'Todo';"

      - name: Remove SQL access token
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sql-token-utf16"

      - name: Remove temporary SQL firewall rule
        if: always()
        shell: bash
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name github-actions-temp \
            --yes
      - name: Create database connection secret
        shell: bash
        run: |
          CONNECTION_STRING="Server=tcp:${{ steps.tfout.outputs.sql_fqdn }},1433;Database=$SQL_DATABASE_NAME;Authentication=Active Directory Managed Identity;Encrypt=True;TrustServerCertificate=False;"

          echo "::add-mask::$CONNECTION_STRING"

          az keyvault update \
            --name "$KEY_VAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --public-network-access Enabled

          for i in {1..12}; do
            if az keyvault show \
              --name "$KEY_VAULT_NAME" \
              --query "properties.publicNetworkAccess" \
              -o tsv | grep -qi "Enabled"; then
              break
            fi
            sleep 10
          done

          az keyvault secret set \
            --vault-name "$KEY_VAULT_NAME" \
            --name database-connection \
            --value "$CONNECTION_STRING" \
            --output none

      - name: Restore Key Vault private-only state
        if: always()
        shell: bash
        run: |
          az keyvault update \
            --name "$KEY_VAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --public-network-access Disabled

      - name: Refresh App Service Key Vault references
        shell: bash
        run: |
          APP_ID=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query id \
            -o tsv)

          az rest \
            --method post \
            --url "https://management.azure.com${APP_ID}/config/configreferences/appsettings/refresh?api-version=2022-03-01"
  deploy:
    name: Stage 3 - Application Deployment
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: todo-api
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: azurecrud-dev-app
          package: ./publish

      - name: Wait for application startup
        shell: bash
        run: sleep 30

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "https://azurecrud-dev-app.azurewebsites.net/health"

      - name: CRUD verification
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://azurecrud-dev-app.azurewebsites.net"

          CREATE_RESPONSE=$(curl --fail --silent --show-error \
            -X POST "$BASE_URL/api/Todo" \
            -H "Content-Type: application/json" \
            -d '{"title":"GitHub Actions Test","description":"Pipeline CRUD test","completed":false}')

          echo "$CREATE_RESPONSE"

          TODO_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')

          if [ -z "$TODO_ID" ] || [ "$TODO_ID" = "null" ]; then
            echo "Failed to obtain Todo ID."
            exit 1
          fi

          curl --fail --silent --show-error \
            "$BASE_URL/api/Todo/$TODO_ID"

          curl --fail --silent --show-error \
            -X PATCH "$BASE_URL/api/Todo/$TODO_ID" \
            -H "Content-Type: application/json" \
            -d '{"completed":true}'

          curl --fail --silent --show-error \
            -X DELETE "$BASE_URL/api/Todo/$TODO_ID"

          echo "CRUD verification completed successfully."
