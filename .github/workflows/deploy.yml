name: Azure CRUD Deployment

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  RESOURCE_GROUP: rg-azure-crud-dev
  APP_NAME: azurecrud-dev-app
  SQL_SERVER_NAME: azurecrud-dev-sql-2026
  SQL_DATABASE_NAME: TodoDb
  KEY_VAULT_NAME: azurecrud-dev-kv-2026

jobs:

  build:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        run: |
          python -m py_compile app/app.py

          test -f app/templates/index.html
          test -f app/static/style.css
          test -f app/sql/init.sql

      - name: Create application package
        run: |
          rm -rf package
          mkdir package
          cp -R app/. package/

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: package/


  infrastructure:
    name: Provision Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_STORAGE_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show --only-show-errors -o table

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tfout
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          SQL_FQDN=$(terraform output -raw sql_fqdn)

          if [ -z "$SQL_FQDN" ]; then
            echo "SQL FQDN is empty."
            exit 1
          fi

          echo "sql_fqdn=$SQL_FQDN" >> "$GITHUB_OUTPUT"

      - name: Add App Service SQL Firewall Rules
        shell: bash
        run: |
          set -euo pipefail

          OUTBOUND_IPS=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query outboundIpAddresses \
            -o tsv)

          IFS=',' read -ra IPS <<< "$OUTBOUND_IPS"

          for IP in "${IPS[@]}"; do
            RULE_NAME="appservice-$(echo "$IP" | tr '.' '-')"

            az sql server firewall-rule create \
              --resource-group "$RESOURCE_GROUP" \
              --server "$SQL_SERVER_NAME" \
              --name "$RULE_NAME" \
              --start-ip-address "$IP" \
              --end-ip-address "$IP" \
              --only-show-errors > /dev/null
          done

          echo "App Service SQL firewall rules configured."

      - name: Install sqlcmd
        shell: bash
        run: |
          set -euo pipefail

          curl https://packages.microsoft.com/keys/microsoft.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg

          curl https://packages.microsoft.com/config/ubuntu/24.04/prod.list | \
            sudo tee /etc/apt/sources.list.d/microsoft-prod.list

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Acquire SQL Access Token
        shell: bash
        run: |
          set -euo pipefail

          SQL_TOKEN=$(az account get-access-token \
            --resource https://database.windows.net \
            --query accessToken \
            -o tsv)

          printf '%s' "$SQL_TOKEN" > "$RUNNER_TEMP/sql-token"

      - name: Initialize Azure SQL Database
        shell: bash
        env:
          SQL_FQDN: ${{ steps.tfout.outputs.sql_fqdn }}
        run: |
          set -euo pipefail

          sqlcmd \
            -S "$SQL_FQDN" \
            -d "$SQL_DATABASE_NAME" \
            -G \
            -P "$RUNNER_TEMP/sql-token" \
            -b \
            -l 60 \
            -i app/sql/init.sql

          echo "Azure SQL database initialized."

      - name: Temporarily Enable Key Vault
        shell: bash
        run: |
          set -euo pipefail

          az keyvault update \
            --name "$KEY_VAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --public-network-access Enabled \
            --only-show-errors > /dev/null

          echo "Key Vault temporarily enabled."

      - name: Create Key Vault SQL Connection Secret
        shell: bash
        env:
          SQL_FQDN: ${{ steps.tfout.outputs.sql_fqdn }}
        run: |
          set -euo pipefail

          CONNECTION_STRING="Server=tcp:${SQL_FQDN},1433;Database=$SQL_DATABASE_NAME;Encrypt=True;TrustServerCertificate=False;"

          echo "::add-mask::$CONNECTION_STRING"

          az keyvault secret set \
            --vault-name "$KEY_VAULT_NAME" \
            --name database-connection \
            --value "$CONNECTION_STRING" \
            --only-show-errors > /dev/null

          echo "Key Vault database-connection secret created."

      - name: Refresh App Service Key Vault References
        shell: bash
        run: |
          set -euo pipefail

          APP_ID=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query id \
            -o tsv)

          az rest \
            --method post \
            --url "https://management.azure.com${APP_ID}/config/configreferences/appsettings/refresh?api-version=2022-03-01" \
            --only-show-errors

          echo "Key Vault references refreshed."

      - name: Restore Key Vault Private Access
        if: always()
        shell: bash
        run: |
          az keyvault update \
            --name "$KEY_VAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --public-network-access Disabled \
            --only-show-errors > /dev/null

          echo "Key Vault public access disabled."

      - name: Remove SQL Token
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sql-token"


  deploy:
    name: Deploy Python Application
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Python Application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./package

      - name: Wait for Application
        run: |
          sleep 30

      - name: Health Check
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            "https://${APP_NAME}.azurewebsites.net/health"

          echo
          echo "Health check passed."

      - name: Verify Todo Create and Read
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://${APP_NAME}.azurewebsites.net"

          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "$BASE_URL/todos" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "title=GitHub Actions Test" \
            --data-urlencode "description=Python Azure SQL Test"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            "$BASE_URL/")

          echo "$RESPONSE"

          if ! echo "$RESPONSE" | grep -q "GitHub Actions Test"; then
            echo "Todo was not found in the application response."
            exit 1
          fi

          echo "Python UI → Azure SQL → Python UI test passed."

      - name: Deployment Summary
        run: |
          echo "Application deployed successfully."
          echo "https://${APP_NAME}.azurewebsites.net"