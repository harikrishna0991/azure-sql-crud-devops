name: Azure CRUD Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  RESOURCE_GROUP: rg-azure-crud-dev
  APP_NAME: azurecrud-dev-app
  SQL_SERVER_NAME: azurecrud-dev-sql-2026
  SQL_DATABASE_NAME: TodoDb
  KEY_VAULT_NAME: azurecrud-dev-kv-2026

jobs:

  build:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application
        shell: bash
        run: |
          set -euo pipefail

          echo "Python version:"
          python --version

          echo "Working directory:"
          pwd

          echo "Application files:"
          find app -maxdepth 3 -type f -print

          echo "Compiling app.py:"
          python -m py_compile app/app.py

          echo "Checking required files:"
          test -f app/app.py
          test -f app/Procfile
          test -f app/requirements.txt
          test -f app/templates/index.html
          test -f app/static/style.css
          test -f app/sql/init.sql

          echo "Python application validation passed."

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package
          mkdir -p package

          cp -R app/. package/

          echo "Deployment package contents:"
          find package -maxdepth 3 -type f -print

      - name: Upload Python artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: package/
          if-no-files-found: error


  infrastructure:
    name: Provision Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_STORAGE_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        shell: bash
        run: |
          set -euo pipefail

          az account show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --only-show-errors \
            -o table

      - name: Terraform Init
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform init -reconfigure

      - name: Terraform Format Check
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tfout
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail

          SQL_FQDN=$(terraform output -raw sql_fqdn)

          if [ -z "$SQL_FQDN" ]; then
            echo "ERROR: SQL FQDN is empty."
            exit 1
          fi

          echo "sql_fqdn=$SQL_FQDN" >> "$GITHUB_OUTPUT"

      - name: Add App Service SQL Firewall Rules
        shell: bash
        run: |
          set -euo pipefail

          OUTBOUND_IPS=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query outboundIpAddresses \
            --output tsv)

          if [ -z "$OUTBOUND_IPS" ]; then
            echo "ERROR: App Service outbound IP addresses are empty."
            exit 1
          fi

          IFS=',' read -ra IPS <<< "$OUTBOUND_IPS"

          for IP in "${IPS[@]}"; do
            RULE_NAME="appservice-$(echo "$IP" | tr '.' '-')"

            az sql server firewall-rule create \
              --resource-group "$RESOURCE_GROUP" \
              --server "$SQL_SERVER_NAME" \
              --name "$RULE_NAME" \
              --start-ip-address "$IP" \
              --end-ip-address "$IP" \
              --only-show-errors \
              --output none
          done

          echo "App Service SQL firewall rules configured."

      - name: Get GitHub Runner Public IP
        id: runner_ip
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -fsS https://api.ipify.org)

          if [ -z "$RUNNER_IP" ]; then
            echo "ERROR: Unable to determine GitHub runner public IP."
            exit 1
          fi

          echo "GitHub runner public IP: $RUNNER_IP"
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

      - name: Add Temporary GitHub Runner SQL Firewall Rule
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP="${{ steps.runner_ip.outputs.ip }}"

          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name github-actions-temp \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --only-show-errors \
            --output none

          echo "Temporary GitHub Actions SQL firewall rule created."

      - name: Install sqlcmd
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc |
            sudo gpg --dearmor \
              --output /usr/share/keyrings/microsoft-prod.gpg

          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list |
            sudo tee /etc/apt/sources.list.d/microsoft-prod.list > /dev/null

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            mssql-tools18 \
            unixodbc-dev

          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Acquire Azure SQL Access Token
        shell: bash
        run: |
          set -euo pipefail

          SQL_TOKEN=$(az account get-access-token \
            --resource https://database.windows.net \
            --query accessToken \
            --output tsv)

          if [ -z "$SQL_TOKEN" ]; then
            echo "ERROR: SQL access token was empty."
            exit 1
          fi

          printf '%s' "$SQL_TOKEN" > "$RUNNER_TEMP/sql-token-utf16"

      - name: Initialize Azure SQL Database
        env:
          SQL_FQDN: ${{ steps.tfout.outputs.sql_fqdn }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Initializing database: $SQL_DATABASE_NAME"
          echo "SQL Server: $SQL_FQDN"

          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_FQDN" \
            -d "$SQL_DATABASE_NAME" \
            -G \
            -P "$RUNNER_TEMP/sql-token-utf16" \
            -b \
            -l 60 \
            -i app/sql/init.sql

          echo "Azure SQL initialization completed."

      - name: Verify Todo Table
        env:
          SQL_FQDN: ${{ steps.tfout.outputs.sql_fqdn }}
        shell: bash
        run: |
          set -euo pipefail

          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_FQDN" \
            -d "$SQL_DATABASE_NAME" \
            -G \
            -P "$RUNNER_TEMP/sql-token-utf16" \
            -b \
            -l 60 \
            -Q "SELECT DB_NAME() AS database_name, OBJECT_ID(N'dbo.Todo', N'U') AS todo_table_id;"

      - name: Temporarily Enable Key Vault
        shell: bash
        run: |
          set -euo pipefail

          az keyvault update \
            --name "$KEY_VAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --public-network-access Enabled \
            --only-show-errors \
            --output none

          echo "Temporary Key Vault public access enabled."

      - name: Create Key Vault SQL Connection Secret
        env:
          SQL_FQDN: ${{ steps.tfout.outputs.sql_fqdn }}
        shell: bash
        run: |
          set -euo pipefail

          CONNECTION_STRING="Server=tcp:${SQL_FQDN},1433;Database=$SQL_DATABASE_NAME;Encrypt=True;TrustServerCertificate=False;"

          echo "::add-mask::$CONNECTION_STRING"

          az keyvault secret set \
            --vault-name "$KEY_VAULT_NAME" \
            --name database-connection \
            --value "$CONNECTION_STRING" \
            --only-show-errors \
            --output none

          echo "Key Vault database-connection secret created."

      - name: Refresh App Service Key Vault References
        shell: bash
        run: |
          set -euo pipefail

          APP_ID=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --query id \
            --output tsv)

          az rest \
            --method post \
            --url "https://management.azure.com${APP_ID}/config/configreferences/appsettings/refresh?api-version=2022-03-01" \
            --only-show-errors

          echo "App Service Key Vault references refreshed."

      - name: Restore Key Vault Private Access
        if: always()
        shell: bash
        run: |
          az keyvault update \
            --name "$KEY_VAULT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --public-network-access Disabled \
            --only-show-errors \
            --output none || true

          echo "Key Vault public access disabled."

      - name: Remove Temporary GitHub Runner SQL Firewall Rule
        if: always()
        shell: bash
        run: |
          if az sql server show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$SQL_SERVER_NAME" \
            --only-show-errors \
            --output none 2>/dev/null; then

            az sql server firewall-rule delete \
              --resource-group "$RESOURCE_GROUP" \
              --server "$SQL_SERVER_NAME" \
              --name github-actions-temp \
              --yes \
              --only-show-errors \
              --output none || true

            echo "Temporary GitHub Actions SQL firewall rule removed."
          else
            echo "SQL server does not exist. Nothing to clean up."
          fi

      - name: Remove SQL Access Token
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/sql-token-utf16"


  deploy:
    name: Deploy Python Application
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        shell: bash
        run: |
          set -euo pipefail

          az account show \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --only-show-errors \
            -o table

      - name: Deploy Python Application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./package

      - name: Restart App Service
        shell: bash
        run: |
          set -euo pipefail

          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --only-show-errors

      - name: Wait for Application Startup
        shell: bash
        run: |
          sleep 30

      - name: Health Check
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://${APP_NAME}.azurewebsites.net"

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 10 \
            "$BASE_URL/health"

          echo
          echo "Health check passed."

      - name: Verify Todo Create and Read
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://${APP_NAME}.azurewebsites.net"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "$BASE_URL/todos" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "title=GitHub Actions Test" \
            --data-urlencode "description=Python Azure SQL Test")

          echo "Create response received."

          if ! echo "$RESPONSE" | grep -q "GitHub Actions Test"; then
            echo "WARNING: Create response did not contain the Todo title."
          fi

          PAGE=$(curl \
            --fail \
            --silent \
            --show-error \
            "$BASE_URL/")

          echo "$PAGE"

          if ! echo "$PAGE" | grep -q "GitHub Actions Test"; then
            echo "ERROR: Created Todo was not found on the UI."
            exit 1
          fi

          echo "Create and Read verification passed."

      - name: Verify Todo Delete
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://${APP_NAME}.azurewebsites.net"

          PAGE=$(curl \
            --fail \
            --silent \
            --show-error \
            "$BASE_URL/")

          TODO_ID=$(echo "$PAGE" |
            grep -oE 'action="/todos/[0-9]+/delete"' |
            grep -oE '[0-9]+' |
            head -n 1 || true)

          if [ -z "$TODO_ID" ]; then
            echo "ERROR: Unable to determine Todo ID for delete verification."
            exit 1
          fi

          echo "Deleting Todo ID: $TODO_ID"

          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "$BASE_URL/todos/$TODO_ID/delete"

          UPDATED_PAGE=$(curl \
            --fail \
            --silent \
            --show-error \
            "$BASE_URL/")

          if echo "$UPDATED_PAGE" | grep -q "GitHub Actions Test"; then
            echo "ERROR: Todo still exists after delete."
            exit 1
          fi

          echo "Delete verification passed."

      - name: Deployment Summary
        shell: bash
        run: |
          echo "=========================================="
          echo "Azure Python CRUD deployment succeeded."
          echo "=========================================="
          echo "Application:"
          echo "https://${APP_NAME}.azurewebsites.net"
          echo
          echo "Health:"
          echo "https://${APP_NAME}.azurewebsites.net/health"